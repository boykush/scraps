story: orient-at-session-start

rules:
  - id: R-01
    name: orient は引数なしの1応答で、規模・文脈・主要タグを揃えて返す
    examples:
      - id: EX-01
        name: scrap_count / tag_count / contexts / top_tags が1回の呼び出しで揃う
      - id: EX-02
        name: contexts は名前順で安定している
    automated: true
  - id: R-02
    name: 主要タグは被リンク数の降順で上位10件に絞る（全量は list_tags の仕事）
    examples:
      - id: EX-01
        name: top_tags の先頭は最も被リンクの多いタグ
      - id: EX-02
        name: タグが10件を超えても top_tags は10件で止まり、tag_count は全量を示す
    automated: true
  - id: R-03
    name: orient も既存ルールの下に入る — 定義は「いつ使うか」で始まり、応答は次の一手を運ぶ
    examples:
      - id: EX-01
        name: 応答の next が search_scraps と lookup_tag_backlinks を名指す
      - id: EX-02
        name: learn-usage-from-tool-defs と follow-response-hints の既存テストが orient にもそのまま効く
    automated: true
  - id: R-04
    name: 使われている type も主要タグと同じ形で返す — 件数の降順で上位10件に絞る（全量は list_types の仕事）
    examples:
      - id: EX-01
        name: top_types は scraps の多い順、同数なら名前順で並び、next が lookup_type_scraps と list_types を名指す
      - id: EX-02
        name: type が10件を超えても top_types は10件で止まり、type_count は全量を示す
    automated: true
  - id: R-05
    name: type を持たない wiki の orient は type で散らからない
    examples:
      - id: EX-01
        name: type_count は 0、top_types は空で、next は type の道具を名指さない
    automated: true

questions:
  - id: Q-01
    text: git 由来の最近更新を orient に足すか（依存なしの決定論 core 方針との兼ね合い）
