story: link-unlinked-mentions

rules:
  - id: R-01
    name: 地の文が他のページの題名をリンクなしで書いていたら、そのページを key で名指して報告する
    examples:
      - id: EX-01
        name: 本文に「Rust」と書いたページに、mentions "Rust" without linking [[Rust]] が出て、位置は「Rust」の4文字を指す
      - id: EX-02
        name: frontmatter の title で照合し、名指しは key（tables/orders）で行う
      - id: EX-03
        name: 同じページの同じ題名は、最初の1か所で1件だけ
    automated: true
  - id: R-02
    name: すでにリンクしている言及、言及でない箇所、自分自身は報告しない
    examples:
      - id: EX-01
        name: wiki-link でも Markdown リンクでも、どこかで一度リンクしていればそのページは出ない
      - id: EX-02
        name: コード、リンクの文字、URL、frontmatter に書かれた題名は出ない
      - id: EX-03
        name: 自分の題名を本文に書いても出ない
    automated: true
  - id: R-03
    name: ラテン文字の題名は語として、分かち書きしない文字の題名は書かれた場所すべてで照合し、重なりは長いほうを取る
    examples:
      - id: EX-01
        name: Git は GitHub・git・Gitter には当たらない
      - id: EX-02
        name: 認可制御 は「ここで認可制御を導入した」の中で当たる
      - id: EX-03
        name: Claude と Claude Code があるとき、「Claude Code」は Claude Code として1件だけ出る
    automated: true
  - id: R-04
    name: 言葉と区別できない題名は照合しない
    examples:
      - id: EX-01
        name: 3文字未満の題名（Go）は照合しない
      - id: EX-02
        name: 2つのページが共有する題名（DDD/Service と Kubernetes/Service）は照合しない
    automated: true
  - id: R-05
    name: リンクすべきかは wiki の方針 — 設定に書くか --rule で呼んだときだけ走る
    examples:
      - id: EX-01
        name: "[lint.unlinked_mention] を書いた wiki では --rule なしの scraps lint がこのルールを走らせる"
      - id: EX-02
        name: 設定も --rule もなければ、既定の lint はこのルールを走らせない
    automated: true

questions:
  - id: Q-01
    text: 分かち書きしない言語の題名が長い語の一部に当たる誤検出（状態 in 状態管理）を、ルールでどこまで減らすか
  - id: Q-02
    text: 一般語に近い題名（リソース など）が警告の多くを占める — 題名ごとに除外できる設定が要るか
  - id: Q-03
    text: 警告を機械が読める形（lint --json）で出すか — いまはスキルが文言の末尾 [[key]] で絞る
  - id: Q-04
    text: スキル側で他にも自前で品質を判定している箇所（タグの既存確認など）を lint に寄せるか
