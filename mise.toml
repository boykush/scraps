[settings]
experimental = true

[tools]
# rust-analyzer is not in the default profile, and apm.yml declares it as an LSP server.
"rust" = { version = "1.98.1", profile = "default", components = ["rust-analyzer"] }
"node" = "26.13.0"
"pnpm" = "12.11.1"
"hk" = "latest"
"pkl" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-deny" = "latest"

[hooks]
postinstall = "hk install --mise"
