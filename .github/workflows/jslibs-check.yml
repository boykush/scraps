name: Browser libraries

on:
  push:
    branches: [ "main" ]
    paths:
      - 'jslibs/**'
      - 'src/usecase/build/js/builtins/**'
      - '.mise-tasks/jslibs/**'
      - '.github/workflows/jslibs-check.yml'
  # No base-branch filter: stacked PRs target another feature branch and
  # still need the same gate as a PR into main.
  pull_request:
    paths:
      - 'jslibs/**'
      - 'src/usecase/build/js/builtins/**'
      - '.mise-tasks/jslibs/**'
      - '.github/workflows/jslibs-check.yml'

env:
  # Only node and pnpm are installed below; keep the task from pulling the
  # rest of the toolchain (rust, pkl, hk) that mise.toml declares.
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        cache: false
        install_args: "node pnpm"
    - name: Check browser libraries
      run: mise run jslibs:check-generated
