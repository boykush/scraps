name: Performance Test

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - 'scraps/**'
      - 'assets/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'README.md'
      - 'CLAUDE.md'

permissions:
  contents: read

jobs:
  performance:
    name: Scraps Build Performance Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
          install_args: "rust"

      - name: Run performance test
        id: build
        run: mise run perf:test
      
      - name: Comment PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BUILD_DURATION: ${{ steps.build.outputs.duration }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        with:
          script: |
            const duration = parseFloat(process.env.BUILD_DURATION);
            const status = process.env.BUILD_STATUS;
            const emoji = status === 'pass' ? '✅' : '❌';

            const comment = `## Performance Test Results 🚀

            Build Time: ${duration} seconds
            Status: ${emoji} ${status.toUpperCase()}

            Executed with: scraps --directory scraps build -v
            Repository: boykush/wiki
            Runner: Ubuntu latest`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
