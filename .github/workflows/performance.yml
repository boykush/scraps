name: Performance Test

on:
  # No paths or types filter: this job is a required check on main, so a PR that
  # skipped it — touching only ignored paths, or reopened without a push — would
  # wait forever for a run that never starts. Irrelevant changes are skipped by
  # the steps below instead, which still lets the job report success.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Scraps Build Performance Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR is checked out as its merge commit; its first parent is the base.
          fetch-depth: 2

      - name: Detect changes that can affect build time
        id: changes
        run: |
          # Fail open: without a readable diff, measure rather than skip.
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(src/|modules/|Cargo\.(toml|lock)$|mise\.toml$|\.mise-tasks/perf/|\.github/workflows/performance\.yml$)'
          if grep -qE "$pattern" <<< "$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No change under the paths that feed the release build; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup mise
        if: steps.changes.outputs.relevant == 'true'
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          install_args: "rust"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.relevant == 'true'

      - name: Run performance test
        id: build
        if: steps.changes.outputs.relevant == 'true'
        run: mise run perf:test

      - name: Comment PR
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_DURATION: ${{ steps.build.outputs.duration }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        with:
          script: |
            const duration = parseFloat(process.env.BUILD_DURATION);
            const status = process.env.BUILD_STATUS;
            const emoji = status === 'pass' ? '✅' : '❌';

            const comment = `## Performance Test Results 🚀

            Build Time: ${duration} seconds
            Status: ${emoji} ${status.toUpperCase()}

            Executed with: scraps --directory scraps build -v
            Repository: boykush/wiki
            Runner: Ubuntu latest`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MISE_AUTO_INSTALL: "false"
