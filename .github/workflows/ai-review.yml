# Reviews the owner's pull requests against the rules in boykush/adr, and approves the
# ones that pass as the Claude GitHub App: the approval the default branch's ruleset asks
# for. The reusable workflow lives in boykush/workflows, whose README lists what adopting
# it takes.
name: ai-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  ai-review:
    uses: boykush/workflows/.github/workflows/ai-review.yml@5167c7846f1d0ea5c8b51105d2fab98ea2f71a36
    permissions:
      contents: read
      pull-requests: read
      id-token: write
