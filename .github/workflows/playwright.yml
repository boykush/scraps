name: Playwright Test
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scraps/**'
      - 'assets/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  test:
    # Hard cap so a hang fails fast. Local full suite is ~15s; CI with browser
    # startup + retries should stay well under this budget.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup mise (install rust)
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        cache: false
        install_args: "rust"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    # Built from this checkout, so the suite renders the PR's templates and CSS
    # instead of a released binary's. Ahead of the browser install so a compile
    # error fails fast, and outside Playwright's webServer command, whose 30s
    # timeout a cold release build would exceed.
    - name: Build scraps
      run: cargo build --release
    - name: Setup Node.js
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        working_directory: ./tests/e2e
        install_args: "node pnpm"
    - name: Install dependencies
      working-directory: ./tests/e2e
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      working-directory: ./tests/e2e
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./tests/e2e
      run: pnpm exec playwright test

env:
  # rust, node and pnpm are installed explicitly by the mise-action steps above; stop
  # the shims from also pulling in the rest of mise.toml (hk, pkl,
  # cargo-llvm-cov, cargo-deny), which this job never runs.
  MISE_AUTO_INSTALL: "false"
