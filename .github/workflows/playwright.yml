name: Playwright Test
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scraps/**'
      - 'assets/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'README.md'
      - 'CLAUDE.md'

permissions:
  contents: read

jobs:
  test:
    # Hard cap so a hang fails fast. Local full suite is ~15s; CI with browser
    # startup + retries should stay well under this budget.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup mise (install scraps)
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      with:
        cache: false
        install_args: "github:boykush/scraps"
    - name: Setup Node.js
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      with:
        working_directory: ./tests/e2e
        install_args: "node"
    - name: Install dependencies
      working-directory: ./tests/e2e
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: ./tests/e2e
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./tests/e2e
      env:
        # Skip auto-install of dev-only tools (rust, cargo-deny, llvm-cov, hk,
        # pkl, markdownlint-cli2) when the webServer subprocess invokes
        # `mise run docs:serve`. Only scraps is required and is installed
        # explicitly by the mise-action step above.
        MISE_AUTO_INSTALL: "false"
      run: npx playwright test
