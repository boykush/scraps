# Managed by Terraform (boykush/github-management): this file is distributed by
# the github_repository_file resource. Edits made directly in a target repo are
# overwritten on the next `terraform apply` — change templates/approve-pr.yml instead.
name: approve-pr

# A PR earns its review the moment it exists, so this runs in the repo holding it
# rather than sweeping from elsewhere.
on:
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  approve:
    name: approve-pr
    # Only the owner's own PRs. GitHub refuses a self-approval, so the review the
    # ruleset requires has to come from another identity. Renovate's PRs are approved
    # from renovate-runner, where the automerge label that gates them is defined.
    # Anyone else's PR never reaches this job and keeps waiting for a real review.
    if: github.event.pull_request.user.login == 'boykush'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # assume the signing role, see below
    steps:
      # The App's private key is in AWS KMS and cannot be read back out: the action
      # assumes the role with this run's OIDC token and has KMS sign the App's JWT.
      # The role trusts a fixed list of repositories, so a repo added to the fan-out
      # also has to be added to github_apps in boykush/infrastructure-as-code.
      - name: Generate approver App token
        id: app-token
        uses: suzuki-shunsuke/create-github-app-token-aws-kms@b4a29a5f1cd6ea2b633d6ee6d9806dbce26493cf # v0.0.3
        with:
          # Written out because Terraform cannot set Actions variables (the
          # installation-token permission schema has no variables key), and a client
          # ID is not a secret. The catalog lists it too.
          client-id: Iv23liuQe4mdgQyAnzLM
          kms-key-id: arn:aws:kms:ap-northeast-1:509266991346:alias/github-app-pr-approver
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-github-app-pr-approver
          # No owner: input, so the token covers only this repository.
          permission-pull-requests: write

      - name: Approve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/pulls/$NUMBER/reviews" --method POST --field event=APPROVE
