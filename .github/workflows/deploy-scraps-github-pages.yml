name: Deploy scraps github pages
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The site is built by the binary from this checkout, so a change to the
      # compiler or its templates changes the published docs too.
      - 'src/**'
      - 'modules/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.mise-tasks/docs/**'
      - '.github/workflows/deploy-scraps-github-pages.yml'
  workflow_dispatch:

env:
  # Only rust is installed below; keep the build from pulling the rest of
  # mise.toml (node, hk, pkl, markdownlint-cli2, cargo-llvm-cov, cargo-deny),
  # which this job never runs.
  MISE_AUTO_INSTALL: "false"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # For scraps git committed date
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: "rust"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Built from source rather than from a release, so docs changes and
      # compiler changes reach the published site in the same push instead of
      # waiting on a release to cut a new binary.
      - name: Build docs
        run: mise run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
