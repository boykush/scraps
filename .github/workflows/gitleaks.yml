# Managed by Terraform (boykush/github-management): this file is distributed by
# the github_repository_file resource. Edits made directly in a target repo are
# overwritten on the next `terraform apply` — change templates/gitleaks.yml instead.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  # A manual run scans the whole history: a repo's first sweep, or a re-check after
  # its .gitleaks.toml / .gitleaksignore changed.
  workflow_dispatch:

# Least privilege by default; the job grants only what gitleaks needs.
permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # zizmor: avoid token persistence (artipacked)
          fetch-depth: 0 # the commit ranges below reach past the tip

      # The release binary, not gitleaks/gitleaks-action: the action is under a
      # proprietary EULA since v2 and calls out to a license server. The checksum pins
      # the exact archive; bump GITLEAKS_VERSION and GITLEAKS_SHA256 together, from the
      # release's gitleaks_<version>_checksums.txt.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # Only the commits this event brings in — a PR's own, or what a push added — so
      # a finding already in history does not red every later PR; the manual run is
      # what sweeps history. --redact keeps the secret out of the log, which anyone can
      # read on a public repo. A repo's own .gitleaks.toml and .gitleaksignore at its
      # root are picked up as is.
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=""
          case "$EVENT" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              # A first push has no usable before (all zeros); scan everything then.
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
          esac
          args=(git --no-banner --redact --verbose)
          if [ -n "$range" ]; then
            args+=("--log-opts=${range}")
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
