name: Cargo test & lint

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'scraps/**'
      - 'assets/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'README.md'
      - 'AGENTS.md'
  # No base-branch filter: stacked PRs target another feature branch and
  # still need the same gate as a PR into main. No paths filter either,
  # unlike push: `build` is a required check on main, so a PR touching only
  # ignored paths would wait forever for a run that never starts.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        cache: false
        install_args: "rust"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Run quality checks
      run: mise run cargo:quality
      # Runs cargo:test, cargo:fmt, cargo:clippy

  deny:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        cache: true
        install_args: "rust cargo:cargo-deny"
    - name: Run cargo-deny checks
      run: mise run cargo:deny
      # Checks advisories, licenses, bans, sources
