name: Cargo test & lint

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'scraps/**'
      - 'assets/**'
      - '.github/workflows/claude-review-from-author.yml'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'scraps/**'
      - 'assets/**'
      - '.github/workflows/claude-review-from-author.yml'
      - 'CONTRIBUTING.md'
      - 'LICENSE.md'
      - 'README.md'
      - 'CLAUDE.md'

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        cache: false
        install_args: "rust"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Run quality checks
      run: mise run cargo:quality
      # Runs cargo:test, cargo:fmt, cargo:clippy

  deny:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        cache: true
        install_args: "rust cargo:cargo-deny"
    - name: Run cargo-deny checks
      run: mise run cargo:deny
      # Checks advisories, licenses, bans, sources
