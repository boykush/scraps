name: Web fonts

on:
  push:
    branches: [ "main" ]
    paths:
      - 'fonts/**'
      - 'src/usecase/build/fonts/**'
      - '.mise-tasks/fonts/**'
      - '.github/workflows/fonts-check.yml'
  # No base-branch filter: stacked PRs target another feature branch and
  # still need the same gate as a PR into main.
  pull_request:
    paths:
      - 'fonts/**'
      - 'src/usecase/build/fonts/**'
      - '.mise-tasks/fonts/**'
      - '.github/workflows/fonts-check.yml'

env:
  # Only node and pnpm are installed below; keep the task from pulling the
  # rest of the toolchain (rust, pkl, hk) that mise.toml declares.
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        cache: false
        install_args: "node pnpm"
    - name: Check web fonts
      run: mise run fonts:check-generated
