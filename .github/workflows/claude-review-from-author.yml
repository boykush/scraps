name: Claude Review - Specific Authors

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review-by-author:
    # Only run for PRs from specific authors
    if: github.event.pull_request.user.login == 'boykush'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Reads the token from Parameter Store with this run's OIDC identity, so
      # this repository keeps no Claude credential of its own. Keep the pin on a
      # revision that refuses a token containing whitespace: with a line break in
      # it, the part after the break would print unmasked in this public log.
      - name: Fetch the Claude Code token
        id: claude-token
        uses: boykush/infrastructure-as-code/.github/actions/claude-code-token@63d18b9ca8f6efd275126605a9b35acb921f8fe7

      - name: Review PR from Specific Author
        timeout-minutes: 60
        uses: anthropics/claude-code-action@5ee796a55f92566ecd7e39d70dd613abcbea0d7c # v1.0.197
        with:
          claude_code_oauth_token: ${{ steps.claude-token.outputs.token }}
          prompt: |
            Please provide a thorough review of this pull request.

            Since this is from a specific author that requires careful review,
            please pay extra attention to:
            - Adherence to project coding standards
            - Proper error handling
            - Security best practices
            - Test coverage
            - Documentation

            Provide detailed feedback and suggestions for improvement.
