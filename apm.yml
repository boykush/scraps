name: scraps
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# Consent to deploy this repository's own skills from .apm/skills/; without it apm audit warns
# that the consent is only implicit.
includes: auto
# apm install generates .mcp.json, .codex/config.toml, .claude/skills/ and .agents/skills/ from
# this file and .apm/; edit those sources, not the generated files.
dependencies:
  apm:
    - boykush/ai-plugins/plugins/adr-remote-mcp#7b757c1de428713dd667b8d74f466762a0229c69
  mcp: []
  # claude-plugins-official's rust-analyzer-lsp keeps this server in its marketplace entry and
  # ships no manifest, so apm can't install it by path. apm writes LSP config for Claude Code only.
  lsp:
    - name: rust-analyzer
      command: rust-analyzer
      extensionToLanguage:
        ".rs": rust
