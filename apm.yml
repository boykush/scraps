name: scraps
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# Consent to deploy this repository's own skills from .apm/skills/; without it apm audit warns
# that the consent is only implicit.
includes: auto
# apm install generates .mcp.json, .codex/config.toml, .claude/skills/ and .agents/skills/ from
# this file and .apm/; edit those sources, not the generated files.
dependencies:
  apm:
    - boykush/adr/plugins/adr-remote-mcp#0ace14215204963afc46838a03502819e705c4c4 # adr-remote-mcp--v0.1.0
    # Owner only: the server sits behind the owner's login, so it connects for no one else. In
    # this repository it is called from the dogfood skill (.apm/skills/dogfood/) and nowhere else.
    - boykush/infrastructure-as-code/plugins/jaeger-remote-mcp#5fbbbe6922fc6a98f06ff2a483a98c4f47ab1203 # jaeger-remote-mcp--v0.1.0
  mcp: []
  # claude-plugins-official's rust-analyzer-lsp keeps this server in its marketplace entry and
  # ships no manifest, so apm can't install it by path. apm writes LSP config for Claude Code only.
  lsp:
    - name: rust-analyzer
      command: rust-analyzer
      extensionToLanguage:
        ".rs": rust
