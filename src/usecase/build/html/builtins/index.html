{% extends "__builtins/base.html" %}

{% block main %}
    <div class="index">
        <div class="links-block">
            <p class="list-head">
                <span class="view-name">{% if view == "backlinks" %}most backlinked{% else %}recently updated{% endif %}</span>
                <span class="stats">{{ scrap_count }} scraps &#183; {{ nav_tags | length }} tags</span>
            </p>
            {{ <scrap_rows scraps={scraps} base_url={base_url} timezone={timezone} /> }}
        </div>
        <div class="paging-arrows">
            {% if prev %}
                <a class="prev" href="{{ prev }}">&#8249; prev</a>
            {% endif %}
            {% if next %}
                <a class="next" href="{{ next }}">next &#8250;</a>
            {% endif %}
        </div>
    </div>
{% endblock %}
