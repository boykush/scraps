[workspace]
[workspace.package]
edition = "2024"
authors = ["boykush <boykush315@gmail.com>"]
license = "MIT"
version = "3.0.1"
description = "Scraps is a portable CLI knowledge hub for managing interconnected Markdown documentation with Wiki-link notation."
homepage = "https://boykush.github.io/scraps"
repository = "https://github.com/boykush/scraps"
documentation = "https://boykush.github.io/scraps"
rust-version = "1.98"
[workspace.dependencies.scraps_libs]
version = "3.0.1"
path = "modules/libs"
[workspace.dependencies]
anyhow = "=1.0.104"
thiserror = "=2.0.21"
url = { version = "=2.5.8", features = ["serde"] }
itertools = "=0.15.0"
serde = { version = "=1.0.229", features = ["derive"] }
# preserve_order keeps frontmatter keys in the order the author wrote them,
# which is the point of passing them through untouched.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
rayon = "=1.12.0"
clap = { version = "=4.6.7", features = ["derive", "env"] }
config = { version = "=0.15.26", features = ["toml"] }
tera = { version = "=2.4.0", features = ["glob_fs"] }
chrono = "=0.4.45"
chrono-tz = { version = "=0.10.4", features = ["serde"] }
colored = "=3.1.1"
hyper = { version = "=1.11.1", features = ["full"] }
tokio = { version = "=1.53.1", features = ["full"] }
http-body-util = "=0.1.5"
hyper-util = { version = "=0.1.21", features = ["full"] }
percent-encoding = "=2.3.2"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
clap-verbosity-flag = "=3.0.4"
indicatif = "=0.18.6"
rmcp = { version = "=3.4.1", features = [
    "server",
    "transport-streamable-http-server",
] }
schemars = "=1.2.2"
rstest = "=0.27.0"
tempfile = "=3.27.0"
annotate-snippets = "=0.12.16"
comfy-table = { version = "=8.0.0", features = ["custom_styling"] }

[package]
edition.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
name = "scraps"
readme = "README.md"
include = [
    "src/",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE.md"
]
[dependencies]
# sub crates
scraps_libs.workspace = true
scraps_libs.features = ["frontmatter", "git", "html", "lang", "markdown", "model", "search", "slugify"]
#external crates
url.workspace = true
itertools.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
config.workspace = true
tera.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
colored.workspace = true
hyper.workspace = true
tokio.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
percent-encoding.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap-verbosity-flag.workspace = true
indicatif.workspace = true
rmcp.workspace = true
schemars.workspace = true
annotate-snippets.workspace = true
comfy-table.workspace = true

[dev-dependencies]
scraps_libs.workspace = true
scraps_libs.features = ["git_test"]
rstest.workspace = true
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
