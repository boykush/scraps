# cargo-deny configuration for Scraps
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# Advisories: check for known vulnerabilities in dependencies
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
ignore = [
    # chrono and chrono-tz were declared unmaintained on the same day (chronotope/chrono#1768).
    # Both are informational, with no vulnerability and no release to move to. scraps uses
    # them for dates and the `timezone` setting; drop these once that moves to another
    # crate (the advisory recommends jiff or time). rmcp and schemars pull chrono in as well,
    # so 0543 stays until they move too.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, no replacement release; dates still need it" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained, no replacement release; timezone handling still needs it" },
]

# Licenses: ensure all dependencies use permissive licenses compatible with MIT
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

# Bans: detect duplicate crate versions and deny specific crates
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# Sources: ensure crates come from trusted registries
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
