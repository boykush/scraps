[package]
name = "scraps_libs"
edition.workspace = true
version = "5.1.1"
authors.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true

[dependencies]
url.workspace = true
comrak = { version = "=0.59.0", default-features = false }
iso639_enum = "=0.6.0"
fuzzy-matcher = { version = "=0.3.7", optional = true }
unicode-normalization = "=0.1.26"
yaml-rust2 = { version = "=0.13.0", optional = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true

[features]
error = []
frontmatter = ["markdown"]
git = []
git_test = []
html = ["markdown", "model", "slugify"]
lang = []
markdown = ["dep:yaml-rust2", "dep:serde_json"]
model = ["markdown", "frontmatter", "dep:chrono"]
search = ["fuzzy-matcher"]
slugify = []
